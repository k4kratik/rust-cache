name: s3

on: [push, pull_request]

jobs:
  s3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    name: s3 with ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: ./
        with:
          workspaces: tests
          cache-provider: s3
          key: my_key

      - run: |
          cargo check
          cargo test
          cargo build --release
        working-directory: tests
